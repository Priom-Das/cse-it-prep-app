name: it_ace
description: "A Flutter application for CSE & IT Job Preparation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # Supabase Integration
  supabase_flutter: ^2.8.0

  # PDF & Video Viewers
  flutter_pdfview: ^1.4.5
  video_player: ^2.8.2
  chewie: ^1.8.1

  # Utilities
  path_provider: ^2.1.6
  http: ^1.2.0
  youtube_player_flutter: ^10.0.1
  dio: ^5.11.1
  permission_handler: ^13.0.2
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true